<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Growth 360 Reel</title>
<meta name="description" content="A 47-second 9:16 motion-design reel built with HTML, CSS and JavaScript, featuring the primegrowth360 Instagram profile on a 3D phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reel.css">
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="bg"></div>
  <div id="scene"></div>
  <div id="cap"></div>
  <div id="vig"></div>
  <div id="flash"></div>
</div></div>
<div id="controls">
  <button id="play" title="Play / pause (Space)">▶</button>
  <input id="scrub" type="range" min="0" max="47" step="0.001" value="0">
  <span id="clock">0:00 / 0:47</span>
  <button id="full" title="Fullscreen (F)">⛶</button>
</div>
<audio id="audio" preload="auto" src="soundtrack.mp3"></audio>
<script src="reel.js"></script>
</body>
</html>
