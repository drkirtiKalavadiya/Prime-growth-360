<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep Shooting Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Inter:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f2f2f2; --fg:#111; --btn:#111; --btnfg:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a1a; --fg:#eee; --btn:#eee; --btnfg:#111; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  canvas { width:min(100%, 405px); aspect-ratio:9/16; height:auto; background:#fff;
           box-shadow:0 4px 24px rgba(0,0,0,.15); border-radius:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button { background:var(--btn); color:var(--btnfg); border:0; border-radius:6px; padding:10px 14px;
           font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:13px; min-height:1em; text-align:center; max-width:420px; }
</style>
</head>
<body>
<canvas id="reel" width="1080" height="1920"></canvas>
<div class="controls">
  <button id="play">Play with sound</button>
  <button id="replay">Replay</button>
  <button id="mute">Sound: on</button>
  <button id="record">Record video (WebM)</button>
</div>
<div id="status"></div>
<!-- soundtrack.wav is generated by make_video.py from the same timeline -->
<audio id="sound" src="soundtrack.wav" preload="auto"></audio>

<script>
/* ------------------------------------------------------------------
   "Getting good at something" – Expectation vs Reality (16 s, 9:16)
   Everything is drawn from one time value t (seconds), so the
   animation is deterministic: the same timeline drives the visuals
   (here) and the sound effects (window.getEvents → make_video.py).
   Edit CONFIG to change text, timing or branding.
------------------------------------------------------------------- */
const CONFIG = {
  title: 'Getting good at something:',
  expectationLabel: 'Expectation',
  realityLabel: 'Reality',
  finalMessage: 'Keep shooting.',
  brand: 'Prime Growth 360',
  duration: 16,           // seconds
  fps: 30,
  // [time (s), misses shown] – counter eases between these and pauses on each
  counterKeys: [[2.65, 1], [4.6, 24], [6.9, 65], [8.4, 176], [10.1, 391], [11.7, 688], [12.9, 1000]],
};

const canvas = document.getElementById('reel');
const ctx = canvas.getContext('2d');
const W = 720, H = 1280;                  // logical drawing size
const SCALE = canvas.width / W;           // 1.5 → 1080 × 1920 output
const HAND = '"Patrick Hand", "Comic Sans MS", cursive';
const BOLD = 'Inter, "Helvetica Neue", Arial, sans-serif';

// Panel geometry (logical pixels)
const P1 = { x: 48, y: 305, w: 624, h: 370 };
const P2 = { x: 48, y: 715, w: 624, h: 370 };
const GROUND = (p) => p.h - 38;
const PLAYER_X = 95;
const RIM = (p) => ({ x: p.w - 88, y: GROUND(p) - 132 });

// ---------- helpers ----------
function rng(seed) {                      // mulberry32 seeded random
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, s) => a + (b - a) * s;
const smooth = (s) => s * s * (3 - 2 * s);

// "Line boil": lines re-draw with tiny random offsets 8× per second,
// like frame-by-frame hand-drawn animation.
let BOIL = 0;
const jit = (id, amp = 1) => (rng(id * 7919 + BOIL * 104729)() - 0.5) * 2 * amp;

function wline(x1, y1, x2, y2, id) {      // wobbly hand-drawn line
  const mx = (x1 + x2) / 2 + jit(id, 1.4), my = (y1 + y2) / 2 + jit(id + 1, 1.4);
  ctx.beginPath();
  ctx.moveTo(x1 + jit(id + 2, 0.8), y1 + jit(id + 3, 0.8));
  ctx.quadraticCurveTo(mx, my, x2 + jit(id + 4, 0.8), y2 + jit(id + 5, 0.8));
  ctx.stroke();
}

function sketchRect(x, y, w, h, id) {
  ctx.strokeStyle = '#222'; ctx.lineCap = 'round';
  ctx.lineWidth = 2.4;
  wline(x, y, x + w, y, id); wline(x + w, y, x + w, y + h, id + 10);
  wline(x + w, y + h, x, y + h, id + 20); wline(x, y + h, x, y, id + 30);
  ctx.lineWidth = 1;                      // overshooting second pass
  wline(x - 6, y + 1.5, x + w + 5, y - 0.5, id + 40);
  wline(x + w + 1, y - 5, x + w - 1, y + h + 6, id + 50);
  wline(x + w + 6, y + h - 1, x - 5, y + h + 1, id + 60);
  wline(x - 1, y + h + 5, x + 1.5, y - 6, id + 70);
}

function text(str, x, y, size, opts = {}) {
  ctx.font = `${opts.weight || ''} ${size}px ${opts.font || HAND}`;
  ctx.fillStyle = opts.color || '#111';
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = opts.alpha ?? 1;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = 1;
}

function arrowDown(x, y1, y2, id) {
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
  wline(x, y1, x, y2, id);
  ctx.beginPath();
  ctx.moveTo(x - 5, y2 - 7); ctx.lineTo(x, y2); ctx.lineTo(x + 5, y2 - 7);
  ctx.stroke();
}

function ball(x, y, r = 10, alpha = 1, spin = 0) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(spin);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = '#e8792b'; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#3a1a05'; ctx.stroke();
  ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(-r, 0); ctx.lineTo(r, 0);
  ctx.moveTo(0, -r); ctx.lineTo(0, r);
  ctx.moveTo(-r * 0.65, -r * 0.75); ctx.quadraticCurveTo(-r * 0.2, 0, -r * 0.65, r * 0.75);
  ctx.moveTo(r * 0.65, -r * 0.75); ctx.quadraticCurveTo(r * 0.2, 0, r * 0.65, r * 0.75);
  ctx.stroke(); ctx.restore();
}

function dashedPath(points, alpha = 1) {
  if (points.length < 2) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash([7, 6]);
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (const p of points) ctx.lineTo(p.x, p.y);
  ctx.stroke(); ctx.restore();
}

// parabolic arc from a to b with apex near peakY
function arc(a, b, peakY, s) {
  const x = lerp(a.x, b.x, s);
  const base = lerp(a.y, b.y, s);
  const k = Math.min(a.y, b.y) - peakY;
  return { x, y: base - 4 * k * s * (1 - s) };
}

// ---------- character & props (same design in both panels) ----------
function player(p, shooting, t, id) {
  const g = GROUND(p), x = PLAYER_X;
  const breathe = shooting ? -3 : Math.sin(t * 4.2) * 1.4;   // subtle idle / jump
  ctx.save();
  ctx.translate(jit(id, 0.5), jit(id + 1, 0.5));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.ellipse(x, g, 28, 4, 0, 0, Math.PI * 2); ctx.fill();
  // legs + shoes (stay planted)
  ctx.lineWidth = 3;
  wline(x - 7, g - 50 + breathe, x - 9, g - 4, id + 2);
  wline(x + 7, g - 50 + breathe, x + 9, g - 4, id + 8);
  ctx.fillStyle = '#111';
  ctx.fillRect(x - 19, g - 7, 14, 6); ctx.fillRect(x + 5, g - 7, 14, 6);
  ctx.translate(0, breathe);
  // shorts
  ctx.lineWidth = 2;
  ctx.fillStyle = '#2b4fa8'; ctx.fillRect(x - 15, g - 66, 30, 18); ctx.strokeRect(x - 15, g - 66, 30, 18);
  // jersey
  ctx.beginPath();
  ctx.moveTo(x - 14, g - 118); ctx.lineTo(x + 14, g - 118);
  ctx.lineTo(x + 16, g - 64); ctx.lineTo(x - 16, g - 64); ctx.closePath();
  ctx.fillStyle = '#3366cc'; ctx.fill(); ctx.stroke();
  text('5', x, g - 88, 15, { align: 'center', color: '#fff' });
  // head
  const hx = x, hy = g - 136;
  ctx.beginPath(); ctx.arc(hx, hy, 15, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(hx + 6, hy, 1.8, 0, Math.PI * 2); ctx.fill();
  // red cap
  ctx.beginPath(); ctx.arc(hx, hy - 3, 16, Math.PI, 0); ctx.closePath();
  ctx.fillStyle = '#d6332b'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hx + 4, hy - 3); ctx.lineTo(hx + 27, hy - 1); ctx.lineWidth = 4;
  ctx.strokeStyle = '#d6332b'; ctx.stroke(); ctx.strokeStyle = '#111';
  // arms
  ctx.lineWidth = 3; ctx.beginPath();
  if (shooting) {
    ctx.moveTo(x + 10, g - 114); ctx.lineTo(x + 28, g - 140); ctx.lineTo(x + 44, g - 156);
    ctx.moveTo(x - 8, g - 114); ctx.lineTo(x + 18, g - 136); ctx.lineTo(x + 36, g - 152);
  } else {
    ctx.moveTo(x + 10, g - 112); ctx.lineTo(x + 26, g - 92); ctx.lineTo(x + 24, g - 100);
    ctx.moveTo(x - 8, g - 112); ctx.lineTo(x + 6, g - 90); ctx.lineTo(x + 16, g - 96);
  }
  ctx.stroke();
  if (!shooting) ball(x + 28, g - 106, 11);
  ctx.restore();
}
const HAND_POS = (p) => ({ x: PLAYER_X + 48, y: GROUND(p) - 165 });

function hoop(p, swishAlpha, id, shake = 0) {
  const g = GROUND(p), r = RIM(p);
  ctx.save(); ctx.translate(jit(id, 0.5), jit(id + 1, 0.5));
  ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  wline(p.w - 40, g, p.w - 40, r.y - 20, id + 2);
  ctx.save(); ctx.translate(0, Math.sin(shake * 40) * shake * 3);   // rim rattle
  ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
  ctx.fillRect(p.w - 58, r.y - 70, 22, 80); ctx.strokeRect(p.w - 58, r.y - 70, 22, 80);
  ctx.strokeStyle = '#d6332b'; ctx.strokeRect(p.w - 52, r.y - 40, 10, 24);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const tx = r.x - 24 + i * 9.6;
    ctx.moveTo(tx, r.y); ctx.lineTo(r.x - 15 + i * 6, r.y + 34);
    ctx.moveTo(tx, r.y); ctx.lineTo(r.x - 15 + Math.min(5, i + 1) * 6, r.y + 34);
  }
  ctx.moveTo(r.x - 20, r.y + 12); ctx.lineTo(r.x + 20, r.y + 12);
  ctx.moveTo(r.x - 17, r.y + 24); ctx.lineTo(r.x + 17, r.y + 24);
  ctx.stroke();
  ctx.strokeStyle = '#d6332b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(r.x - 26, r.y); ctx.lineTo(p.w - 58, r.y); ctx.stroke();
  ctx.restore();
  if (swishAlpha > 0) {
    text('swish', r.x - 8, r.y - 64, 22, { alpha: swishAlpha });
    ctx.save(); ctx.globalAlpha = swishAlpha; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
    wline(r.x - 4, r.y - 52, r.x - 1, r.y - 34, id + 20);
    wline(r.x - 22, r.y - 44, r.x - 16, r.y - 30, id + 26);
    wline(r.x - 46, r.y - 2, r.x - 34, r.y, id + 32);
    wline(r.x - 44, r.y + 22, r.x - 34, r.y + 14, id + 38);
    ctx.restore();
  }
  ctx.restore();
}

// ---------- timeline ----------
const EXP_SHOT = { start: 0.3, dur: 1.2 };
const MAKES = [{ start: 12.95, dur: 1.0 }, { start: 14.55, dur: 1.0 }];   // final made shots
const SHOT_FLIGHT = 0.95, DROP = 0.4;
const FIRST_LAUNCH = CONFIG.counterKeys[0][0] - SHOT_FLIGHT - DROP;
const TOTAL = CONFIG.counterKeys[CONFIG.counterKeys.length - 1][1];

function missCount(t) {
  const K = CONFIG.counterKeys;
  if (t < K[0][0]) return 0;
  for (let i = 0; i < K.length - 1; i++) {
    const [t0, v0] = K[i], [t1, v1] = K[i + 1];
    if (t < t1) return Math.round(lerp(v0, v1, smooth((t - t0) / (t1 - t0))));
  }
  return TOTAL;
}
// counter "pop" when a milestone is reached
function milestonePop(t) {
  let pop = 0;
  for (const [tk] of CONFIG.counterKeys) { const d = t - tk; if (d >= 0 && d < 0.35) pop = 1 - d / 0.35; }
  return pop;
}

// decorative missed shots, accelerating over time
const SHOTS = (() => {
  const r = rng(42), shots = [];
  let t = FIRST_LAUNCH;
  const end = CONFIG.counterKeys[CONFIG.counterKeys.length - 1][0] - SHOT_FLIGHT - DROP;
  while (t < end) {
    const prog = clamp((t - FIRST_LAUNCH) / (end - FIRST_LAUNCH), 0, 1);
    shots.push({
      t, prog,
      endX: lerp(200, RIM(P2).x - 10, Math.pow(prog, 0.7)) + (r() - 0.5) * 60 * (1 - prog * 0.6),
      hitRim: prog > 0.35 && r() < 0.7,
      rimJitter: (r() - 0.5) * 22,
      peak: lerp(GROUND(P2) - 200, 40 + r() * 25, Math.pow(prog, 0.8)),
      drift: (r() - 0.5) * 40,
    });
    t += Math.max(0.13, 0.95 * Math.pow(1 - prog, 1.5));
  }
  return shots;
})();

// pile slots: a heap that grows bottom-up
const PILE = (() => {
  const r = rng(7), slots = [], g = GROUND(P2), cx = P2.w * 0.6, R = 10;
  [20, 18, 17, 15, 13, 11, 9, 7, 5, 3, 1].forEach((n, row) => {
    for (let i = 0; i < n; i++) {
      slots.push({
        x: cx + (i - (n - 1) / 2) * (R * 1.9) + (r() - 0.5) * 3,
        y: g - R - row * (R * 1.62) + (r() - 0.5) * 2,
        spin: r() * 6,
        key: row + r() * 2.2,
      });
    }
  });
  slots.sort((a, b) => a.key - b.key);
  return slots;
})();
const pileShown = (t) => {
  const m = missCount(t);
  return Math.min(m, Math.round(PILE.length * Math.pow(m / TOTAL, 0.75)));
};

function pileTopAt(x, n) {
  let top = GROUND(P2) - 10;
  for (let i = 0; i < n; i++) {
    const s = PILE[i];
    if (Math.abs(s.x - x) < 14) top = Math.min(top, s.y - 18);
  }
  return top;
}

function shotEnd(s, p) {
  const rim = RIM(p);
  return s.hitRim ? { x: rim.x + s.rimJitter, y: rim.y - 6 } : { x: s.endX, y: GROUND(p) - 40 };
}

// sound-effect cue sheet, derived from the same timeline
window.getEvents = function () {
  const ev = [];
  ev.push({ t: EXP_SHOT.start, type: 'throw' });
  ev.push({ t: EXP_SHOT.start + EXP_SHOT.dur, type: 'swish' });
  ev.push({ t: EXP_SHOT.start + EXP_SHOT.dur + 0.55, type: 'bounce', v: 0.5 });
  for (const s of SHOTS) {
    ev.push({ t: s.t, type: 'throw', v: 0.6 });
    if (s.hitRim) ev.push({ t: s.t + SHOT_FLIGHT, type: 'rim' });
    ev.push({ t: s.t + SHOT_FLIGHT + DROP, type: 'bounce', v: 1 });
  }
  let last = 0, lastTick = -1;
  for (let f = 0; f < CONFIG.duration * 60; f++) {         // soft ticks as counter rolls
    const t = f / 60, m = missCount(t);
    if (m !== last && t - lastTick > 0.07) { ev.push({ t, type: 'tick' }); lastTick = t; }
    last = m;
  }
  for (const [t] of CONFIG.counterKeys) ev.push({ t, type: 'milestone' });
  for (const m of MAKES) {
    ev.push({ t: m.start, type: 'throw' });
    ev.push({ t: m.start + m.dur, type: 'swish' });
  }
  ev.push({ t: 14.0, type: 'final' });
  return ev.filter((e) => e.t >= 0 && e.t < CONFIG.duration).sort((a, b) => a.t - b.t);
};

// ---------- scenes ----------
function drawExpectation(t) {
  const p = P1; ctx.save(); ctx.translate(p.x, p.y);
  sketchRect(0, 0, p.w, p.h, 100);
  text(CONFIG.expectationLabel, 18, 40, 30);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
  wline(20, GROUND(p), p.w - 20, GROUND(p), 180);

  const a = HAND_POS(p), rim = RIM(p), peak = 50;
  const s = clamp((t - EXP_SHOT.start) / EXP_SHOT.dur, 0, 1);
  const shooting = t >= EXP_SHOT.start;
  if (s > 0) {
    const pts = [];
    for (let i = 0; i <= 40; i++) pts.push(arc(a, rim, peak, (i / 40) * s));
    dashedPath(pts);
    const lab = arc(a, rim, peak, 0.12);
    text('1 shot', lab.x + 4, lab.y - 6, 22, { alpha: clamp(s * 4, 0, 1) });
    if (s > 0.08) arrowDown(lab.x + 32, lab.y + 2, lab.y + 20, 190);
  }
  hoop(p, t > EXP_SHOT.start + EXP_SHOT.dur ? 1 : 0, 200);
  if (s > 0 && s < 1) { const b = arc(a, rim, peak, s); ball(b.x, b.y, 11, 1, s * 8); }
  else if (s >= 1) {
    const d = clamp((t - EXP_SHOT.start - EXP_SHOT.dur) / 0.6, 0, 1);
    if (d < 1) ball(rim.x, rim.y + 10 + d * 110, 11, 1 - d);
  }
  player(p, shooting, t, 300);
  ctx.restore();
}

function drawReality(t) {
  const p = P2; ctx.save(); ctx.translate(p.x, p.y);
  sketchRect(0, 0, p.w, p.h, 400);
  text(CONFIG.realityLabel, 18, 40, 30);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
  wline(20, GROUND(p), p.w - 20, GROUND(p), 480);

  const misses = missCount(t), shown = pileShown(t);

  // rim rattle from the most recent rim hit
  let shake = 0;
  for (const s of SHOTS) {
    const d = t - (s.t + SHOT_FLIGHT);
    if (s.hitRim && d >= 0 && d < 0.3) shake = Math.max(shake, 1 - d / 0.3);
  }
  let swish = 0;
  for (const m of MAKES) if (t >= m.start + m.dur) swish = 1;
  hoop(p, swish, 500, shake);

  for (let i = 0; i < shown; i++) ball(PILE[i].x, PILE[i].y, 10, 1, PILE[i].spin);

  let lastLaunch = -1;
  for (const s of SHOTS) {
    const age = t - s.t;
    if (age < 0) break;
    lastLaunch = s.t;
    if (age > SHOT_FLIGHT + DROP + 0.9) continue;
    const a = HAND_POS(p), end = shotEnd(s, p);
    const fs = clamp(age / SHOT_FLIGHT, 0, 1);
    const trailAlpha = age < SHOT_FLIGHT ? 0.8 : clamp(0.8 - (age - SHOT_FLIGHT) / 1.0, 0, 0.8);
    const pts = [];
    for (let i = 0; i <= 30; i++) pts.push(arc(a, end, s.peak, (i / 30) * fs));
    dashedPath(pts, trailAlpha);
    if (age < SHOT_FLIGHT) {
      const b = arc(a, end, s.peak, fs); ball(b.x, b.y, 10, 1, fs * 9);
    } else if (age < SHOT_FLIGHT + DROP) {
      const d = (age - SHOT_FLIGHT) / DROP;
      const x = end.x + s.drift * d - (s.hitRim ? 30 * d : 0);
      const landY = pileTopAt(x, shown);
      const bounceUp = s.hitRim ? Math.sin(d * Math.PI) * 22 : 0;   // pop off the rim
      ball(x, lerp(end.y, landY, d * d) - bounceUp, 10, 1, d * 5);
    }
  }

  // the made shots at the end – the player keeps shooting
  let shooting = lastLaunch >= 0 && t - lastLaunch < 0.3;
  for (const m of MAKES) {
    const fs = clamp((t - m.start) / m.dur, 0, 1);
    if (fs <= 0) continue;
    if (t - m.start < 0.35) shooting = true;
    const a = HAND_POS(p), rim = RIM(p), peak = 40;
    const after = t - m.start - m.dur;
    const pts = [];
    for (let i = 0; i <= 40; i++) pts.push(arc(a, rim, peak, (i / 40) * fs));
    dashedPath(pts, after > 0 ? clamp(1 - after / 1.2, 0.25, 1) : 1);
    if (fs < 1) { const b = arc(a, rim, peak, fs); ball(b.x, b.y, 10, 1, fs * 9); }
    else if (after < 0.6) ball(rim.x, rim.y + 10 + (after / 0.6) * 100, 10, 1 - after / 1.2);
  }

  if (misses > 0) {
    const label = `${misses.toLocaleString('en-US')} ${misses === 1 ? 'miss' : 'misses'}`;
    const pop = milestonePop(t);
    ctx.save(); ctx.translate(150, 220); ctx.scale(1 + pop * 0.18, 1 + pop * 0.18);
    text(label, 0, 0, 28);
    ctx.restore();
    arrowDown(185, 233, 300, 590);
  }
  player(p, shooting, t, 600);
  ctx.restore();
}

function render(t) {
  BOIL = Math.floor(t * 8);
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  text(CONFIG.title, W / 2, 260, 44, { font: BOLD, weight: 800, align: 'center' });
  drawExpectation(t);
  drawReality(t);
  const endA = clamp((t - 14.0) / 0.6, 0, 1);
  if (endA > 0) {
    ctx.save(); ctx.translate(W / 2, 1165);
    const s = 0.85 + 0.15 * smooth(endA); ctx.scale(s, s);
    text(CONFIG.finalMessage, 0, 0, 42, { font: BOLD, weight: 800, align: 'center', alpha: endA });
    ctx.restore();
  }
  text(CONFIG.brand, W / 2, 1232, 20, { align: 'center', color: '#888' });
}

// ---------- playback (with synced soundtrack) ----------
const audio = document.getElementById('sound');
const playBtn = document.getElementById('play');
const muteBtn = document.getElementById('mute');
const status = document.getElementById('status');
let start = performance.now(), paused = true, pausedAt = 0, recording = false, muted = false;

const now = () => (performance.now() - start) / 1000;
function syncAudio(t) {
  if (muted) return;
  try { audio.currentTime = t; const p = audio.play(); if (p) p.catch(() => {}); } catch (e) {}
}

function loop(ts) {
  if (!paused) {
    let t = now();
    if (t > CONFIG.duration) {
      if (recording) t = CONFIG.duration;
      else { start = ts; t = 0; syncAudio(0); }
    }
    render(t);
  }
  requestAnimationFrame(loop);
}

playBtn.onclick = () => {
  if (paused) {
    start = performance.now() - pausedAt * 1000; paused = false; playBtn.textContent = 'Pause';
    syncAudio(pausedAt);
  } else {
    pausedAt = now(); paused = true; playBtn.textContent = 'Play'; audio.pause();
  }
};
document.getElementById('replay').onclick = () => {
  start = performance.now(); paused = false; playBtn.textContent = 'Pause'; syncAudio(0);
};
muteBtn.onclick = () => {
  muted = !muted; muteBtn.textContent = `Sound: ${muted ? 'off' : 'on'}`;
  if (muted) audio.pause(); else if (!paused) syncAudio(now());
};

document.getElementById('record').onclick = (e) => {
  if (!window.MediaRecorder) { status.textContent = 'Recording is not supported in this browser.'; return; }
  const btn = e.target; btn.disabled = true; recording = true;
  const stream = canvas.captureStream(CONFIG.fps);
  try {                                   // add the soundtrack when the browser allows it
    const cap = audio.captureStream ? audio.captureStream() : audio.mozCaptureStream && audio.mozCaptureStream();
    if (cap && !muted) cap.getAudioTracks().forEach((tr) => stream.addTrack(tr));
  } catch (err) {}
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    const a = document.createElement('a'); a.href = url; a.download = 'keep-shooting.webm'; a.click();
    status.textContent = 'Saved keep-shooting.webm. For a full-quality MP4 with sound, run make_video.py.';
    btn.disabled = false; recording = false;
  };
  paused = false; playBtn.textContent = 'Pause'; start = performance.now(); syncAudio(0);
  rec.start();
  status.textContent = `Recording ${CONFIG.duration}s…`;
  setTimeout(() => rec.stop(), CONFIG.duration * 1000 + 300);
};

// hooks for headless export (make_video.py)
window.renderFrame = render;
window.REEL = CONFIG;

document.fonts.ready.then(() => { render(0); requestAnimationFrame(loop); });
</script>
</body>
</html>
